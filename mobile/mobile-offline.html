<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <title data-pwa-i18n-title="offlineTitle">MCurator Mobile — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        background: #f6f7fb;
        color: #182033;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      .mc-site-logo {
        display: block;
        width: min(320px, 100%);
        height: auto;
        margin: 0 auto 16px;
        border-radius: 12px;
        mix-blend-mode: multiply;
      }
      p {
        margin: 0 0 16px;
        color: #64748b;
        line-height: 1.5;
      }
      a {
        color: #3154e8;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mc-site-logo" src="/brand/lockup-horizontal-light.jpg" alt="MCurator" />
      <h1 data-pwa-i18n="offlineHeading">MCurator Mobile is offline</h1>
      <p data-pwa-i18n="offlineBody">The app shell is cached, but this page could not reach the network. Reconnect and reopen the installed app.</p>
      <a href="./mobile.html#/mobile/loading" data-pwa-i18n="retry">Retry</a>
    </main>
    <script src="./i18n/pwa-shell.js"></script>
  </body>
</html>
