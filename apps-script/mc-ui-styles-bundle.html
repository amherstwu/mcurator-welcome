<style id="mc-gas-bundled-css">

/* ===== mcurator-museum.css ===== */
/**
 * ACTIVE FILE — used by UI.html
 * Do not import old landing / museum versions at the same time.
 *
 * Welcome / Landing — museum cinema + TCG passport (v1 overrides)
 * Loaded after main UI.html styles. Full-bleed, hero procedural layer, card depth, a11y motion.
 */

/* --- No black side gutters: clip horizontal scroll, let sections span viewport --- */
.welcome-landing-body {
  overflow-x: clip;
}

#welcomePhaseIntro .welcome-desktop-frame,
#welcomePhaseIntro .welcome-card--landing {
  max-width: none !important;
  width: 100%;
}

#welcomeLandingPage.welcome-lp {
  padding-left: 0;
  padding-right: 0;
}

/* Museum narrative surface: full width */
.mc-museum-surface.lp-landing-museum {
  max-width: none !important;
  width: 100%;
  padding-left: 0;
  padding-right: 0;
}

/* Core LP sections: full-bleed within landing (avoid 100vw — wider than 100% when vertical scrollbar exists → overflow / jitter at fullscreen) */
#mcWelcomeHero.c-hero.mc-welcome-hero,
section.lp-fragment-theater,
section#lp-problem.somp-section,
#lp-solution,
section#welcomeWorkflowSection,
#welcomeFeatureGridSection,
section#lp-usp,
section#lp-media,
#welcomeGateSection {
  width: 100%;
  max-width: none;
  margin-left: 0;
  margin-right: 0;
  position: relative;
  box-sizing: border-box;
}

/* Hero: taller, no boxed feel */
#mcWelcomeHero {
  min-height: min(92vh, 960px);
  padding-top: 0;
  padding-bottom: clamp(80px, 8vh, 96px);
  box-sizing: border-box;
  overflow-x: clip;
  z-index: 2;
}
#mcWelcomeHero .mc-welcome-hero__content,
#mcWelcomeHero .lp-hero__content--split {
  max-width: min(1280px, 100% - 40px) !important;
  margin-left: auto;
  margin-right: auto;
}
/* Desktop hero: ~50% / ~44% text vs preview — matches UI.html #mcWelcomeHero grid at ≥1024px */
@media (min-width: 1024px) {
  #mcWelcomeHero .c-hero__row.lp-hero__row,
  .c-hero#mcWelcomeHero .lp-hero__row {
    min-height: min(88dvh, 900px);
    align-items: center;
  }
  #mcWelcomeHero .lp-hero__copy {
    min-width: 0;
    max-width: min(620px, 52vw);
  }
  #mcWelcomeHero .lp-hero__stage {
    min-width: 0;
    max-width: min(640px, 46vw);
    display: flex;
    justify-content: center;
  }
}

/* Remove static photo mural — procedural canvas + atmos only */
#lpHeroLandingMural {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse 120% 80% at 48% 18%, rgba(38, 58, 88, 0.42) 0%, transparent 56%),
    radial-gradient(ellipse 80% 50% at 82% 58%, rgba(28, 44, 68, 0.32) 0%, transparent 52%),
    linear-gradient(185deg, #05080f 0%, #0a101a 42%, #070a12 100%);
}

#lpHeroLandingMuralImg {
  background-image: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

.lp-hero-museum-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 1;
  pointer-events: none;
  mix-blend-mode: screen;
  opacity: 0.55;
}

#lpHeroLandingMural .lp-hero-landing-mural__scrim {
  z-index: 2;
  background: linear-gradient(180deg, rgba(4, 8, 10, 0.15) 0%, rgba(6, 9, 12, 0.75) 85%, #06090c 100%);
}

/* Atmos + content above mural */
#mcWelcomeHero .c-hero__atmos {
  z-index: 3;
}

#mcWelcomeHero .mc-welcome-hero__content,
#mcWelcomeHero .lp-hero__content {
  position: relative;
  z-index: 4;
}

/* Copy: left column width band */
@media (min-width: 1024px) {
  .lp-hero__content--split .lp-hero__copy {
    max-width: min(620px, 45vw);
  }
}

/* Hero title scale: desktop 52–72px, mobile 34–42 */
#mcWelcomeHero .mc-hero-title.welcome-title--art,
#mcWelcomeHero .lp-hero__h1 {
  font-size: clamp(2.125rem, 1.5rem + 1.2vw, 3.2rem);
  line-height: 1.1;
  letter-spacing: -0.03em;
  max-width: 22ch;
}
@media (min-width: 1024px) {
  #mcWelcomeHero .mc-hero-title.welcome-title--art,
  #mcWelcomeHero .lp-hero__h1 {
    font-size: clamp(2.4rem, 0.2rem + 2.6vw, 4.75rem);
  }
}

#mcWelcomeHero .mc-hero-sub.lp-hero__sub {
  font-size: clamp(0.94rem, 0.2rem + 0.5vw, 1.1rem);
  line-height: 1.6;
  max-width: 42ch;
  color: rgba(232, 237, 245, 0.82);
}
html[lang|="zh"] #mcWelcomeHero .mc-hero-sub.lp-hero__sub {
  line-height: 1.75;
}
@media (min-width: 1024px) {
  #mcWelcomeHero .mc-hero-sub.lp-hero__sub {
    font-size: clamp(1.05rem, 0.85rem + 0.3vw, 1.1rem);
    max-width: 44ch;
  }
}

#mcWelcomeHero .lp-hero__chips {
  gap: 8px 10px;
  margin-top: 1.25rem;
}

#mcWelcomeHero .lp-hero__chip {
  font-size: 0.875rem;
  padding: 0.4rem 0.75rem;
}

/* Primary CTA: glass teal, lift */
#mcWelcomeHero .lp-hero__cta-primary.primary-btn {
  min-height: 50px;

    transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),

}

@media (hover: hover) {
  #mcWelcomeHero .lp-hero__cta-primary.primary-btn:hover {

      0 12px 40px rgba(12, 60, 50, 0.45);
  }
}

#mcWelcomeHero .lp-hero__cta-secondary.soft-btn {
  min-height: 50px;
  font-size: 0.98rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px);
  transition: background 0.35s ease, border-color 0.35s ease, transform 0.4s ease;
}

@media (hover: hover) {
  #mcWelcomeHero .lp-hero__cta-secondary.soft-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(200, 230, 255, 0.35);
  }
}

/* --- Fragment / passport section breathing room --- */
#lp-fragment-theater {
  padding-top: clamp(48px, 8vw, 100px) !important;
  padding-bottom: clamp(48px, 8vw, 100px) !important;
  padding-left: clamp(16px, 3vw, 32px) !important;
  padding-right: clamp(16px, 3vw, 32px) !important;
}

#lp-fragment-theater .lp-sec-h {
  font-size: clamp(1.75rem, 3.5vw, 2.75rem) !important;
  line-height: 1.15;
  max-width: 20ch;
}

#lp-fragment-theater .lp-sec-dek {
  font-size: clamp(1rem, 1.25vw, 1.15rem) !important;
  line-height: 1.6;
  max-width: 58ch;
  color: rgba(245, 242, 234, 0.7) !important;
}

#lp-fragment-theater .lp-sec-eyebrow {
  font-size: 0.8rem;
  letter-spacing: 0.2em;
}

/* Hide dense micro line + redundant USP repeaters in fragment intro */
#lp-fragment-theater .lp-ft3-mic,
#lp-fragment-theater .lp-ft3-usp {
  display: none !important;
}

/* Three-card stage: depth + TCG proportions */
.lp-ft3-scene.passport-card-stage {
  perspective: 1600px;
  padding: clamp(24px, 4vw, 48px) 0 32px;
}

.lp-ft3-cwrap.passport-card-cwrap {
  transform-style: preserve-3d;
}

/* Featured center: tall passport — keep width band to avoid “thin strip” */
.passport-card--featured.lp-ft3-card--center {
  width: min(100%, 480px) !important;
  min-width: min(440px, calc(100vw - 32px)) !important;
  min-height: 600px !important;
  max-width: 520px !important;
  transform: translateZ(24px) scale(1);
  z-index: 3;
  flex: 0 0 auto;
}
#welcomeMuseumBody .lp-ft3-row#lpFt3Track {
  justify-content: center;
  align-items: flex-start;
  gap: clamp(8px, 1.5vw, 20px);
  flex-wrap: wrap;
  min-width: 0;
}
#welcomeMuseumBody .lp-ft3-scene__stage {
  width: 100%;
  min-width: 0;
  overflow: visible;
}
@media (min-width: 1024px) and (max-width: 1200px) {
  .passport-card--featured.lp-ft3-card--center {
    min-width: min(420px, 92%) !important;
  }
}

/* Side cards: smaller, rotated, recede */
.passport-card--side.lp-ft3-card {
  width: min(320px, 78vw) !important;
  min-height: 500px !important;
  opacity: 0.92;
  filter: saturate(0.95);
  z-index: 1;
  transition:
    transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
    opacity 0.45s ease,
    filter 0.45s ease,
    box-shadow 0.5s ease;
}

.passport-card--side.passport-card--tiltL {
  transform: rotateZ(-4.5deg) scale(0.9) translateY(12px);
}

.passport-card--side:not(.passport-card--tiltL) {
  transform: rotateZ(4.5deg) scale(0.9) translateY(12px);
}

@media (hover: hover) {
  .lp-ft3-card:hover,
  .lp-ft3-card:focus-within {
    z-index: 4 !important;
    opacity: 1 !important;
    filter: none;
    transform: translateZ(40px) scale(0.95) rotateZ(0deg) !important;
  }
}

/* Card scientific name + meta scale */
.passport-card .lp-ft3-tax {
  font-size: clamp(1.25rem, 1.6vw, 1.6rem) !important;
  line-height: 1.2;
}

.passport-card .passport-card__k {
  font-size: 0.7rem !important;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.75;
}

.passport-card .passport-card__v {
  font-size: 0.88rem !important;
}

/* Field mapping strip: secondary — show on card hover / focus / tap */
.lp-ft3-fields--hlStrip {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  margin: 0 !important;
  padding: 0 !important;
  transition:
    max-height 0.5s ease,
    opacity 0.4s ease;
}

.lp-ft3-card:hover .lp-ft3-fields--hlStrip,
.lp-ft3-card:focus-within .lp-ft3-fields--hlStrip,
.lp-ft3-card.lp-ft3-card--fieldOpen .lp-ft3-fields--hlStrip {
  max-height: 220px;
  opacity: 1;
  margin-top: 0.5rem !important;
}

/* Problem / USP sections: body text size */
.somp-body,
.lp-sec-dek,
.lp-usp--narrative .lp-acc__preview {
  font-size: clamp(1rem, 1.1vw, 1.12rem) !important;
  line-height: 1.65;
}

.somp-headline,
#lpProblemH {
  font-size: clamp(1.6rem, 2.8vw, 2.4rem) !important;
  line-height: 1.2;
}

/* Reduced motion: turn off card 3D hover */
@media (prefers-reduced-motion: reduce) {
  .lp-hero-museum-canvas {
    opacity: 0.25;
  }

  .passport-card--side.lp-ft3-card,
  .passport-card--featured.lp-ft3-card--center,
  #mcWelcomeHero .lp-hero__cta-primary.primary-btn {
    transition: none !important;
  }

  .passport-card--side.lp-ft3-card {
    transform: scale(0.9) translateY(8px) !important;
  }

  .lp-origin-panel__mapPin,
  .lp-origin-panel__mapRings {
    animation: none !important;
  }
}

/* —— Fragment stage + Origin / Provenance panel (museum map module) */
.lp-ft3-scene--with-origin {
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(20px, 3vw, 36px);
  align-items: start;
  width: 100%;
  max-width: min(100%, 1920px);
  margin-left: auto;
  margin-right: auto;
  box-sizing: border-box;
  padding: 0 clamp(12px, 2.5vw, 28px);
}

@media (min-width: 1200px) {
  .lp-ft3-scene--with-origin {
    grid-template-columns: minmax(0, 1fr) min(300px, 24vw);
    align-items: stretch;
  }
}

.lp-ft3-scene__stage {
  position: relative;
  min-width: 0;
  min-height: min(640px, 80vh);
}

/* Stylized “museum map” for provenance (not tile maps) */
.lp-origin-panel {
  position: relative;
  z-index: 4;
  min-width: 0;
  padding: clamp(18px, 2.4vw, 24px) clamp(16px, 2.2vw, 22px);
  border-radius: 18px;
  border: 1px solid rgba(120, 200, 170, 0.2);
  background:
    linear-gradient(165deg, rgba(20, 35, 40, 0.7) 0%, rgba(6, 10, 14, 0.9) 100%),
    radial-gradient(ellipse 90% 60% at 70% 0%, rgba(50, 90, 80, 0.35) 0%, transparent 60%);
  box-shadow:
    0 18px 48px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(10px);
}

@media (min-width: 1200px) {
  .lp-origin-panel {
    top: 8px;
  }
}

.lp-origin-panel__eyebrow {
  margin: 0 0 0.2rem;
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(160, 210, 200, 0.88);
}

.lp-origin-panel__h {
  margin: 0 0 1rem;
  font-size: clamp(0.9rem, 1.1vw, 1.1rem);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.2;
  color: rgba(245, 250, 248, 0.95);
}

.lp-origin-panel__map {
  position: relative;
  height: 120px;
  margin: 0 0 1rem;
  border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(6, 14, 20, 0.95) 0%, rgba(4, 10, 12, 1) 100%);
  border: 1px solid rgba(80, 150, 140, 0.18);
  overflow: hidden;
  isolation: isolate;
}

.lp-origin-panel__mapGrid {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(100, 160, 150, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100, 160, 150, 0.08) 1px, transparent 1px);
  background-size: 14% 20%;
  mask-image: radial-gradient(ellipse 100% 90% at 50% 45%, #000 35%, transparent 100%);
  opacity: 0.5;
  pointer-events: none;
}

.lp-origin-panel__mapRings {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 100px;
  height: 100px;
  margin: -50px 0 0 -50px;
  border-radius: 50%;
  border: 1px solid rgba(120, 200, 160, 0.15);
  box-shadow: 0 0 0 1px rgba(200, 180, 100, 0.08) inset, 0 0 20px rgba(20, 80, 50, 0.15);
  pointer-events: none;
  animation: lpOriginRings 5s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  .lp-origin-panel__mapRings {
    animation: none;
  }
}

@keyframes lpOriginRings {
  0%,
  100% {
    transform: scale(0.9);
    opacity: 0.4;
  }
  50% {
    transform: scale(1.04);
    opacity: 0.6;
  }
}

.lp-origin-panel__mapPin {
  position: absolute;
  left: 52%;
  top: 46%;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin: -5px 0 0 -5px;
  background: radial-gradient(circle at 30% 30%, #fff, rgba(120, 220, 200, 0.3) 45%, #1a2a2a 100%);
  box-shadow: 0 0 0 2px rgba(200, 180, 100, 0.35), 0 0 20px rgba(100, 200, 160, 0.3);
  animation: lpOriginPin 3.5s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  .lp-origin-panel__mapPin {
    animation: none;
  }
}

@keyframes lpOriginPin {
  0%,
  100% {
    box-shadow: 0 0 0 2px rgba(200, 180, 100, 0.35), 0 0 20px rgba(100, 200, 160, 0.3);
  }
  50% {
    box-shadow: 0 0 0 3px rgba(220, 200, 120, 0.5), 0 0 28px rgba(120, 200, 160, 0.45);
  }
}

#lp-fragment-theater .lp-origin-blk {

/* Field highlight: fragment chips glow + match museum tone */

#lp-fragment-theater[data-lp-hl='tax'] .lp-ft3-frag--tax,
#lp-fragment-theater[data-lp-hl='med'] .lp-ft3-frag--med,
#lp-fragment-theater[data-lp-hl='geo'] .lp-ft3-frag--geo,

/**
 * MCurator museum-grade v2 — design tokens, typography, and landing chrome.
 * Loaded after welcome-museum-v1.css; augments (does not fully replace) legacy rules.
 */
:root {
  /* Spec palette (§20) */
  --mc-bg-0: #05080a;
  --mc-bg-1: #0b1115;
  --mc-bg-2: #101820;
  --mc-surface-1: rgba(255, 255, 255, 0.06);
  --mc-surface-2: rgba(255, 255, 255, 0.09);
  --mc-surface-3: rgba(255, 255, 255, 0.12);
  --mc-line-1: rgba(255, 255, 255, 0.12);
  --mc-line-2: rgba(180, 220, 200, 0.22);
  --mc-accent-museum: #8fd6b0;
  --mc-accent-amber: #d8b56d;
  --mc-accent-cyan: #7cc7d8;
  --mc-text-1: #f4f7f5;
  --mc-text-2: #b9c5c0;
  --mc-text-3: #7d8a86;

  /* Map into existing app variables where used by legacy CSS */
  --bg: var(--mc-bg-0);
  --bg-mid: var(--mc-bg-1);
  --text: var(--mc-text-1);
  --text-secondary: var(--mc-text-2);
  --muted: var(--mc-text-3);
  --line: var(--mc-line-1);
  --font-body: "Inter", "Noto Sans TC", "Noto Sans JP", system-ui, sans-serif;
}

/* Chinese body copy: generous line height */

:lang(zh-Hant) .c-hero__sub,
:lang(zh-Hant) .somp-body,

}

/**
 * MCurator Museum v3 — interactive digital archive: 3D passport, deck, journey polish.
 * Complements v1/v2. Respects .mc-v3-reduce (hook for prefers-reduced-motion).
 */
:root {
  --mc3-ease: cubic-bezier(0.2, 0.75, 0.2, 1);
  --mc3-ease-out: cubic-bezier(0.16, 0.9, 0.2, 1);
  --mc3-hero3d: 560px;
}

/* —— Hero: 3D passport ——
   重作：不跑 JS 逐幀、不做無限 transform 關鍵幀。父層 perspective，單一 .mc-hero3d__scene
   在 :hover 時以 transition 做 3D（一條變化路徑、合成穩定）。內圖不另加 transform 避免與 3D 衝突。 */
.mc-hero3d {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: nowrap;
  gap: 12px 0;
  min-height: 560px;
  /* 透視在 .lp-hero__stage（UI）已設一層；本節點再設會變兩層 3D、陰影/翻面合成錯亂 */
  perspective: none;
  margin: 0 auto;
  max-width: min(520px, 100%);
  z-index: 4;
  box-sizing: border-box;
}

/* 單一節點做 3D 傾斜。勿用 width:100%（與 .mc-hero-aux 並排時會把右欄擠斷行）。 */
.mc-hero3d__scene {
  position: relative;
  z-index: 1;
  flex: 0 1 auto;
  width: auto;
  min-width: 0;
  max-width: min(500px, 100%);
  transform: translate3d(0, -4px, 0);
  transform-style: preserve-3d;
  transition: transform 0.15s var(--mc3-ease, cubic-bezier(0.2, 0.75, 0.2, 1));
  backface-visibility: hidden;
}
#mcHero3d.mc-hero3d--tilt .mc-hero3d__scene {

/* ===== sat-unified.css ===== */
/**
 * SAT unified system: metallic passport cards + coverflow + admin + logo.
 * Flicker-safe: no backdrop-filter on large surfaces; explicit transitions only.
 */

/* ---- Logo (square transparent container) ---- */
.mc-logo-square {
  width: 96px;
  height: 96px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 24px;
  background: transparent;
  overflow: hidden;
  flex-shrink: 0;
}
.mc-logo-square img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

/* ---- Metallic passport card (shared) ---- */
.sat-metal-card {
  --metal-a: rgba(255, 255, 255, 0.55);
  --metal-b: rgba(148, 163, 184, 0.35);
  --metal-c: rgba(15, 23, 42, 0.95);
  position: relative;
  width: clamp(210px, 22vw, 340px);
  max-width: 100%;
  aspect-ratio: 0.68;
  border-radius: 28px;
  padding: 1px;
  background:
    linear-gradient(135deg, var(--metal-a), var(--metal-b) 38%, rgba(255, 255, 255, 0.18) 52%, var(--metal-a)),
    linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03));
  box-shadow: 0 26px 80px rgba(0, 0, 0, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  transform-style: preserve-3d;
  backface-visibility: hidden;
  contain: layout paint style;
}
.sat-metal-card[data-rarity='common'] {
  --metal-a: rgba(226, 232, 240, 0.95);
  --metal-b: rgba(100, 116, 139, 0.55);
}
.sat-metal-card[data-rarity='rare'] {
  --metal-a: rgba(202, 138, 4, 0.95);
  --metal-b: rgba(120, 53, 15, 0.55);
}
.sat-metal-card[data-rarity='epic'] {
  --metal-a: rgba(52, 211, 153, 0.95);
  --metal-b: rgba(6, 95, 70, 0.55);
}
.sat-metal-card[data-rarity='legendary'] {
  --metal-a: rgba(250, 204, 21, 0.95);
  --metal-b: rgba(146, 64, 14, 0.65);
}
.sat-metal-card[data-rarity='mythic'] {
  --metal-a: rgba(216, 180, 254, 0.95);
  --metal-b: rgba(45, 212, 191, 0.75);
}
.sat-metal-card__inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 27px;
  transform-style: preserve-3d;
  transition: transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sat-metal-card.is-flipped .sat-metal-card__inner {
  transform: rotateY(180deg);
}
.sat-metal-card__face {
  position: absolute;
  inset: 0;
  border-radius: 27px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.98));
  display: flex;
  flex-direction: column;
}
.sat-metal-card__back {
  transform: rotateY(180deg);
  padding: 16px 18px;
  overflow-y: auto;
  text-align: left;
}
.sat-metal-card__image {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  display: block;
  background: #0f172a;
}
.sat-metal-card__body {
  padding: 10px 14px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #f8fafc;
}
.sat-metal-card__kicker {
  font: 800 10px/1.1 Inter, system-ui, sans-serif;
  letter-spacing: 0.14em;
  color: rgba(250, 204, 21, 0.88);
  margin: 0;
}
.sat-metal-card__title {
  font: 700 15px/1.2 Inter, system-ui, sans-serif;
  margin: 0;
  color: #f1f5f9;
}
.sat-metal-card__sci {
  font: italic 600 16px/1.15 Fraunces, Georgia, serif;
  margin: 0;
  color: #e2e8f0;
}
.sat-metal-card__origin {
  font: 600 12px/1.3 Inter, system-ui, sans-serif;
  color: rgba(226, 232, 240, 0.75);
  margin: 0;
}
.sat-metal-card__id {
  font: 700 11px/1.2 ui-monospace, monospace;
  color: rgba(167, 243, 208, 0.9);
  margin: 0;
}
.sat-metal-card__badge {
  align-self: flex-start;
  margin-top: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font: 700 9px/1 Inter, system-ui, sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;

  border: 1px solid rgba(255, 255, 255, 0.2);

.sat-metal-card__verify {

.sat-metal-card__dl {

/* ---- Hero: compact SAT passport (same metal system) ---- */
#mcHero3d .sat-metal-card--hero .sat-metal-card__face.mc-hero3d__face--satFront {
  padding: 0;
  overflow: visible;

/* =============================================================================
   Interactive game-card / SAT passport (shell → tilt → inner flip ONLY)
   Tilt + float + specular on .card-tilt; flip on .card-inner only.
   ============================================================================= */

.card-shell.sat-passport-shell {
  --metal-a: rgba(255, 255, 255, 0.55);
  --metal-b: rgba(148, 163, 184, 0.35);
  --shell-glow: rgba(52, 211, 153, 0.22);
  position: relative;
  width: 100%;
  max-width: 100%;
  border-radius: 28px;
  padding: 1px;
  background:
    linear-gradient(135deg, var(--metal-a), var(--metal-b) 38%, rgba(255, 255, 255, 0.18) 52%, var(--metal-a)),
    linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03));
  box-shadow:
    0 22px 70px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.34);
  transform: none !important;
  filter: none;
  perspective: 1100px;
  transform-style: preserve-3d;
  contain: layout paint style;
}
.card-shell.sat-passport-shell[data-rarity='common'] {
  --metal-a: rgba(226, 232, 240, 0.95);
  --metal-b: rgba(100, 116, 139, 0.55);
  --shell-glow: rgba(148, 163, 184, 0.35);
}
.card-shell.sat-passport-shell[data-rarity='rare'] {
  --metal-a: rgba(202, 138, 4, 0.95);
  --metal-b: rgba(120, 53, 15, 0.55);
  --shell-glow: rgba(250, 204, 21, 0.35);
}
.card-shell.sat-passport-shell[data-rarity='epic'] {
  --metal-a: rgba(52, 211, 153, 0.95);
  --metal-b: rgba(6, 95, 70, 0.55);
  --shell-glow: rgba(45, 212, 191, 0.4);
}
.card-shell.sat-passport-shell[data-rarity='legendary'] {
  --metal-a: rgba(250, 204, 21, 0.95);
  --metal-b: rgba(146, 64, 14, 0.65);
  --shell-glow: rgba(251, 191, 36, 0.45);
}
.card-shell.sat-passport-shell[data-rarity='mythic'] {
  --metal-a: rgba(216, 180, 254, 0.95);
  --metal-b: rgba(45, 212, 191, 0.75);
  --shell-glow: rgba(167, 139, 250, 0.45);
}

.card-shell.sat-passport-shell:hover {
  box-shadow:
    0 28px 88px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.1),
    0 0 28px var(--shell-glow),
    inset 0 1px 0 rgba(255, 255, 255, 0.38);
}

.card-tilt {
  --lift-y: 0px;
  --tilt-x: 0deg;
  --tilt-y: 0deg;
  --mx: 50;
  --my: 50;
  position: relative;
  border-radius: 27px;
  transform-style: preserve-3d;
  transform: translateY(var(--lift-y)) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
  transition: transform 0.14s ease-out, box-shadow 0.18s ease;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
  background: rgba(2, 6, 23, 0.2);
  overflow: hidden;
  will-change: transform;
}

.card-shell.sat-passport-shell:hover .card-tilt {
  --lift-y: -6px;
  box-shadow: 0 28px 64px rgba(0, 0, 0, 0.48), 0 0 22px var(--shell-glow);
}

.card-tilt::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 3;
  opacity: 0.55;
  mix-blend-mode: soft-light;
  background: radial-gradient(
    120% 90% at calc(var(--mx) * 1%) calc(var(--my) * 1%),
    rgba(255, 255, 255, 0.55) 0%,
    rgba(255, 255, 255, 0.12) 28%,
    transparent 58%
  );
  transition: opacity 0.12s ease;
}

.card-inner {
  position: relative;
  width: 100%;
  min-height: 100%;
  border-radius: 26px;
  transform-style: preserve-3d;
  transform: rotateY(0deg);
  transition: transform 0.58s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.card-inner.is-flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  inset: 0;
  border-radius: 26px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(2, 6, 23, 0.99));
  display: flex;
  flex-direction: column;

/* ===== specimen-record-card.css ===== */
/**
 * Global specimen card standard ??all specimen-related surfaces use this layout.
 * Tilt on .specimen-record-card; flip on .specimen-record-card__inner (is-flipped on article).
 *
 * Card Passport Studio / exports use `.passport-card-locked` + `locked-passport-standard.css`
 * as the locked museum passport (640?1010). Hero / feature cards here are marketing shells;
 * align new work to that locked component when showing the same product preview.
 */

.specimen-record-card {
  --metal-a: #d7c16d;
  --metal-b: #5c5025;
  --glow: rgba(215, 193, 109, 0.26);
  --rx: 0deg;
  --ry: 0deg;
  --mx: 50;
  --my: 50;
  --lift: 0px;

  position: relative;
  width: min(504px, 76vw);
  aspect-ratio: 0.72;
  border-radius: 34px;
  padding: 3px;
  transform: translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry));
  transform-style: preserve-3d;
  transition:
    transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 180ms ease;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.38) 0%,
    rgba(215, 193, 109, 0.78) 16%,
    rgba(75, 68, 38, 0.46) 38%,
    rgba(255, 255, 255, 0.12) 54%,
    rgba(110, 92, 43, 0.68) 76%,
    rgba(255, 255, 255, 0.24) 100%
  );
  box-shadow:
    0 34px 90px rgba(0, 0, 0, 0.48),
    0 0 0 1px rgba(255, 255, 255, 0.08),
    0 0 42px var(--glow);
  will-change: transform;
}

.specimen-record-card:hover {
  --lift: -8px;
  box-shadow:
    0 46px 120px rgba(0, 0, 0, 0.58),
    0 0 55px var(--glow);
}

.specimen-record-card__inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 31px;
  overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 560ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.specimen-record-card.is-flipped .specimen-record-card__inner {
  transform: rotateY(180deg);
}

/* Welcome hero: inner overflow clips 3D ??back reads as mirrored front (WebKit/Blink). */
#mcHero3dTumbler.specimen-record-card--hero,
#mcWelcomeHero #mcProductHeroPassport.specimen-record-card--hero,
#mcWelcomeHero .mc-hero-deck__card.specimen-record-card--hero .specimen-record-card__inner,
#lpFeaturePassportCard.specimen-record-card--feature .specimen-record-card__inner {
  overflow: visible;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

#mcHero3dTumbler.specimen-record-card--hero,
#mcWelcomeHero #mcProductHeroPassport.specimen-record-card--hero,
#lpFeaturePassportCard.specimen-record-card--feature .specimen-record-card__face.specimen-record-card__front {
  transform: translateZ(1px);
}

.specimen-record-card__face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 31px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  padding: 28px 34px;
  box-sizing: border-box;
  color: #f4efe1;
  background:
    radial-gradient(circle at 50% -10%, rgba(215, 193, 109, 0.12), transparent 35%),
    linear-gradient(160deg, rgba(31, 49, 39, 0.98), rgba(5, 20, 16, 0.98) 48%, rgba(1, 8, 7, 0.98));
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.1),
    inset 0 0 0 1px rgba(255, 255, 255, 0.06),
    inset 0 -24px 50px rgba(0, 0, 0, 0.22);
}

.specimen-record-card__face.specimen-record-card__back {
  transform: rotateY(180deg);
}

.specimen-record-card__face::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.12;
  border-radius: inherit;
  background: repeating-linear-gradient(
    155deg,
    rgba(255, 255, 255, 0.04) 0,
    rgba(255, 255, 255, 0.04) 1px,
    transparent 1px,
    transparent 8px
  );
}

.specimen-record-card__face::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  opacity: 0;
  background: radial-gradient(
    circle at calc(var(--mx, 50) * 1%) calc(var(--my, 50) * 1%),
    rgba(255, 255, 255, 0.22),
    rgba(255, 255, 255, 0.08) 18%,
    transparent 38%
  );
  transition: opacity 160ms ease;
  mix-blend-mode: screen;
}

.specimen-record-card:hover .specimen-record-card__face::after {
  opacity: 0.38;
}

.specimen-record-card__top {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 14px;
}

.specimen-record-card__verified,
